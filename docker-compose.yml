version: '3.8'

services:
  backend:
    build:
      context: ./investa_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - INVESTA_SECRET_KEY=${INVESTA_SECRET_KEY:-change-me-in-production}
      - INVESTA_DEBUG=${INVESTA_DEBUG:-False}
      - INVESTA_ALLOWED_HOSTS=${INVESTA_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - INVESTA_CORS_ORIGINS=${INVESTA_CORS_ORIGINS:-http://localhost:3000,http://localhost:8081}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ping/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  backend_media:
  backend_static:
